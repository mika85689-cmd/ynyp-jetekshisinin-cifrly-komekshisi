databases:
  - name: synyp-ai-db
    plan: free
    databaseName: synyp_ai
    user: synyp_ai
services:
  - type: web
    name: synyp-ai-komekshi
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: synyp-ai-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
