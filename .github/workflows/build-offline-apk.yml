name: Build Offline Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android-offline/**'
      - 'Synyp_jetekshisinin_cifrly_komekshisi_FINAL_WORKING (3).html'
      - '.github/workflows/build-offline-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare offline web app asset
        run: |
          mkdir -p android-offline/app/src/main/assets
          cp 'Synyp_jetekshisinin_cifrly_komekshisi_FINAL_WORKING (3).html' android-offline/app/src/main/assets/index.html

      - name: Build debug APK
        run: gradle -p android-offline assembleDebug --stacktrace

      - name: Rename APK
        run: cp android-offline/app/build/outputs/apk/debug/app-debug.apk Synyp_Komekshi_Offline.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Synyp-Komekshi-Offline-APK
          path: Synyp_Komekshi_Offline.apk
          if-no-files-found: error
